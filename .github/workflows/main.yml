name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties with API key
        run: |
          if [ -z "${{ secrets.OPEN_WEATHER_API_KEY }}" ]; then
            echo "::error::OPEN_WEATHER_API_KEY secret is not set"
            exit 1
          fi
          echo "OPEN_WEATHER_API_KEY=${{ secrets.OPEN_WEATHER_API_KEY }}" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug — show source tree on runner
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== app/src/main/java files ==="
          find app/src/main/java -name "*.kt" | sort
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || echo "(missing)"
          echo "=== app/build.gradle.kts (first 60 lines) ==="
          head -60 app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --info 2>&1 | tee /tmp/build.log

      - name: Show Kotlin compile diagnostics
        if: always()
        run: |
          echo "=== App tasks that ran ==="
          grep -E "^> Task :app:" /tmp/build.log || echo "(no app tasks found)"
          echo
          echo "=== Kotlin source files seen by the compiler ==="
          grep -A 60 -i "Kotlin source files" /tmp/build.log | head -80 || echo "(compiler never printed a source list)"
          echo
          echo "=== Compile errors ==="
          grep -E "^e: " /tmp/build.log || echo "(none)"
          echo
          echo "=== NO-SOURCE / UP-TO-DATE warnings for :app ==="
          grep -E "NO-SOURCE|UP-TO-DATE|SKIPPED" /tmp/build.log | grep ":app:" || echo "(none)"
          echo
          echo "=== MainActivity.class produced? ==="
          find app/build -name "MainActivity*.class" 2>/dev/null || echo "(NO — MainActivity was not compiled!)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weatherstore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
