name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties with API key
        run: |
          if [ -z "${{ secrets.OPEN_WEATHER_API_KEY }}" ]; then
            echo "::error::OPEN_WEATHER_API_KEY secret is not set"
            exit 1
          fi
          echo "OPEN_WEATHER_API_KEY=${{ secrets.OPEN_WEATHER_API_KEY }}" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug — show source tree
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Repo root ==="
          ls -la
          echo "=== app/ ==="
          ls -la app/
          echo "=== app/build.gradle.kts exists? ==="
          ls -la app/build.gradle.kts
          echo "=== Kotlin source files ==="
          find app/src/main/java -name "*.kt" | sort
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || echo "(missing)"

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --info 2>&1 | tee /tmp/build.log

      - name: Show Kotlin compile summary
        if: always()
        run: |
          echo "=== Tasks that ran ==="
          grep -E "^> Task :app:" /tmp/build.log || echo "(no app tasks found)"
          echo
          echo "=== Kotlin source files seen by compiler ==="
          grep -A 40 "Kotlin source files" /tmp/build.log | head -60 || echo "(compiler source list not printed)"
          echo
          echo "=== Compile errors ==="
          grep -E "^e: " /tmp/build.log || echo "(no compile errors)"
          echo
          echo "=== NO-SOURCE / UP-TO-DATE warnings ==="
          grep -E "NO-SOURCE|UP-TO-DATE" /tmp/build.log | grep ":app:" || echo "(none)"
          echo
          echo "=== Class output check ==="
          find app/build -name "MainActivity*.class" 2>/dev/null || echo "(no MainActivity.class produced!)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weatherstore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
